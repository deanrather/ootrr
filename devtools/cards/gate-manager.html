<!--{"title": "Enemy-Gate Manager", "order": 30, "open": true}-->
<iframe id="gate-frame" title="Enemy-Gate Manager" style="width:100%;height:320px;border:0;display:block;background:transparent"></iframe>
<div id="gate-missing" style="display:none;font-size:12px;color:var(--mute);margin-top:6px">The gate manager is not answering: <code>placer_server.py</code> runs on port 8766.</div>
<script>
(() => {
  const k = new URLSearchParams(location.search).get('key') || '';
  const f = document.getElementById('gate-frame');
  f.src = location.protocol + '//' + location.hostname + ':' + (new URLSearchParams(location.search).get('placer') || 8766) + '/gate' + '?panel=' + location.port + (k ? '&key=' + encodeURIComponent(k) : '');
  const ping = () => { try { f.contentWindow.postMessage('heightPing', '*'); } catch (e) {} };
  f.addEventListener('load', () => { ping(); setTimeout(ping, 800); });
  if (window.IntersectionObserver) new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) ping(); }).observe(f);
  f.onerror = () => { document.getElementById('gate-missing').style.display = ''; };
  window.addEventListener('message', e => {
    if (e.source === f.contentWindow && e.data && typeof e.data.gateHeight === 'number' && e.data.gateHeight > 60) f.style.height = Math.ceil(e.data.gateHeight) + 'px';
  });
})();
</script>
